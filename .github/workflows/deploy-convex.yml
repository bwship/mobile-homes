name: Deploy Convex

on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-convex.yml"
  workflow_dispatch:

concurrency:
  group: deploy-convex-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Convex
        run: pnpm exec tsc -p convex

      - name: Check CONVEX_DEPLOY_KEY
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is empty. Add it in GitHub → Settings → Secrets and variables → Actions (production deploy key from the Convex dashboard)."
            exit 1
          fi

      - name: Deploy Convex production
        run: pnpm exec convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
